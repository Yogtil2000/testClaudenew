<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>जेसीबी हिशोब</title>
<meta name="theme-color" content="#181c1a" />
<meta name="description" content="जेसीबी मशीनचं रोजचं काम आणि पैशाचा हिशोब ठेवण्यासाठी अ‍ॅप" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="JCB हिशोब" />
<link rel="manifest" href="manifest.json" />

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #181c1a; }
  #fallback {
    display: none; min-height: 100vh; align-items: center; justify-content: center;
    color: #f3efe4; font-family: sans-serif; text-align: center; padding: 24px;
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="fallback">
  <div>
    <div style="font-size:18px;font-weight:bold;margin-bottom:8px;">लोड होण्यात अडचण आली</div>
    <div style="font-size:14px;color:#8a988f;">कृपया इंटरनेट कनेक्शन तपासा आणि पान पुन्हा उघडा (रिफ्रेश करा).</div>
  </div>
</div>
<script>
  window.addEventListener('load', function () {
    setTimeout(function () {
      var root = document.getElementById('root');
      if (!root || root.children.length === 0) {
        document.getElementById('fallback').style.display = 'flex';
      }
    }, 6000);
  });
</script>

<script>
(function () {
  var e = React.createElement;
  var useState = React.useState;
  var useEffect = React.useEffect;
  var useCallback = React.useCallback;

  /* ---------- local persistent storage (per-device) ---------- */
  var LS_KEY = "jcb-hisab-entries-v1";
  var BACKUP_LOG_KEY = "jcb-hisab-backup-log";
  var localStore = {
    get: function () {
      return new Promise(function (resolve, reject) {
        try {
          var raw = window.localStorage.getItem(LS_KEY);
          resolve(raw ? { value: raw } : null);
        } catch (err) { reject(err); }
      });
    },
    set: function (value) {
      return new Promise(function (resolve, reject) {
        try {
          window.localStorage.setItem(LS_KEY, value);
          resolve({ value: value });
        } catch (err) { reject(err); }
      });
    }
  };

  var monthNames = ["जाने", "फेब्रु", "मार्च", "एप्रिल", "मे", "जून", "जुलै", "ऑगस्ट", "सप्टें", "ऑक्टो", "नोव्हें", "डिसें"];

  var C = {
    bg: "#181c1a", surface: "#232823", surface2: "#2b322b", line: "#3a423a",
    yellow: "#f5b700", rust: "#c1440e", steel: "#8a988f", paper: "#f3efe4",
    green: "#7aa663", black: "#0f120f"
  };

  function fmt(n) { return "₹" + Math.round(n || 0).toLocaleString("en-IN"); }
  function monthKey(dateStr) {
    var d = new Date(dateStr);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  }
  function monthLabel(key) {
    var parts = key.split("-");
    return monthNames[parseInt(parts[1]) - 1] + " " + parts[0];
  }
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function formatLogDate(iso) {
    var d = new Date(iso);
    var datePart = d.toLocaleDateString("mr-IN", { day: "2-digit", month: "short", year: "numeric" });
    var timePart = d.toLocaleTimeString("mr-IN", { hour: "2-digit", minute: "2-digit" });
    return datePart + " · " + timePart;
  }
  function formatRelative(iso) {
    var days = Math.floor((new Date() - new Date(iso)) / (1000 * 60 * 60 * 24));
    if (days <= 0) return "आज";
    if (days === 1) return "काल";
    return days + " दिवसांपूर्वी";
  }
  function emptyForm() {
    return {
      date: todayStr(), site: "", startReading: "", endReading: "",
      rate: "", received: "", diesel: "", otherExpenses: [{ amount: "", note: "" }]
    };
  }

  function DigitMeter(props) {
    var value = props.value, digits = props.digits;
    var str = String(Math.max(0, Math.round(value))).padStart(digits, "0").split("");
    return e("div", {
      style: { display: "flex", background: C.black, border: "2px solid #000", boxShadow: "inset 0 2px 6px rgba(0,0,0,0.6)", borderRadius: 6, padding: 6 }
    }, str.map(function (d, i) {
      return e("div", {
        key: i,
        style: { fontWeight: 800, fontSize: 24, width: 20, textAlign: "center", margin: "0 1px", borderRadius: 2, color: C.yellow, background: "#141814", textShadow: "0 0 6px rgba(245,183,0,0.35)" }
      }, d);
    }));
  }

  function JcbHisab() {
    var entriesState = useState([]); var entries = entriesState[0]; var setEntries = entriesState[1];
    var editingIdState = useState(null); var editingId = editingIdState[0]; var setEditingId = editingIdState[1];
    var formState = useState(emptyForm()); var form = formState[0]; var setForm = formState[1];
    var saveStatusState = useState({ ok: true, msg: "लोड होत आहे…" }); var saveStatus = saveStatusState[0]; var setSaveStatus = saveStatusState[1];
    var toastState = useState(""); var toast = toastState[0]; var setToast = toastState[1];
    var backupTextState = useState(""); var backupText = backupTextState[0]; var setBackupText = backupTextState[1];
    var backupLogState = useState([]); var backupLog = backupLogState[0]; var setBackupLog = backupLogState[1];
    var advancedOpenState = useState(false); var advancedOpen = advancedOpenState[0]; var setAdvancedOpen = advancedOpenState[1];
    var tabState = useState("home"); var tab = tabState[0]; var setTab = tabState[1]; // home | new | history | backup

    var showToast = useCallback(function (msg) {
      setToast(msg);
      setTimeout(function () { setToast(""); }, 2500);
    }, []);

    useEffect(function () {
      localStore.get().then(function (res) {
        var data = res && res.value ? JSON.parse(res.value) : [];
        setEntries(data);
        setSaveStatus({ ok: true, msg: "✓ " + data.length + " जुन्या नोंदी सापडल्या" });
      }).catch(function () {
        setEntries([]);
        setSaveStatus({ ok: true, msg: "✓ जतन सुविधा तयार आहे (अजून नोंदी नाहीत)" });
      });
      try {
        var logRaw = window.localStorage.getItem(BACKUP_LOG_KEY);
        setBackupLog(logRaw ? JSON.parse(logRaw) : []);
      } catch (err) {
        setBackupLog([]);
      }
    }, []);

    var persist = useCallback(function (list) {
      return localStore.set(JSON.stringify(list)).then(function () {
        setSaveStatus({ ok: true, msg: "✓ जतन झाले (या फोनवर)" });
      }).catch(function (err) {
        setSaveStatus({ ok: false, msg: "⚠️ जतन करताना अडचण: " + err.message });
        showToast("जतन करताना अडचण आली — खाली 'पुन्हा जतन करा' दाबा");
      });
    }, [showToast]);

    var retrySave = useCallback(function () { return persist(entries); }, [persist, entries]);

    var startReadingNum = parseFloat(form.startReading) || 0;
    var endReadingNum = parseFloat(form.endReading) || 0;
    var rateNum = parseFloat(form.rate) || 0;
    var hoursCalc = Math.max(endReadingNum - startReadingNum, 0);
    var amountCalc = hoursCalc * rateNum;

    function updateOtherRow(idx, field, value) {
      setForm(function (f) {
        var rows = f.otherExpenses.slice();
        var row = Object.assign({}, rows[idx]);
        row[field] = value;
        rows[idx] = row;
        return Object.assign({}, f, { otherExpenses: rows });
      });
    }
    function addOtherRow() {
      setForm(function (f) {
        return Object.assign({}, f, { otherExpenses: f.otherExpenses.concat([{ amount: "", note: "" }]) });
      });
    }
    function removeOtherRow(idx) {
      setForm(function (f) {
        return Object.assign({}, f, { otherExpenses: f.otherExpenses.filter(function (_, i) { return i !== idx; }) });
      });
    }
    function resetForm() { setForm(emptyForm()); setEditingId(null); }

    function handleSubmit() {
      var dateVal = form.date || todayStr();
      var siteVal = form.site.trim() || "नोंद";
      var otherExpenses = form.otherExpenses
        .filter(function (x) { return (parseFloat(x.amount) || 0) > 0 || x.note.trim(); })
        .map(function (x) { return { amount: parseFloat(x.amount) || 0, note: x.note.trim() }; });
      var otherTotal = otherExpenses.reduce(function (s, x) { return s + x.amount; }, 0);

      var fields = {
        date: dateVal, site: siteVal, startReading: startReadingNum, endReading: endReadingNum,
        hours: hoursCalc, rate: rateNum, amount: amountCalc,
        received: parseFloat(form.received) || 0, diesel: parseFloat(form.diesel) || 0,
        otherExpenses: otherExpenses, other: otherTotal
      };

      var next;
      if (editingId) {
        next = entries.map(function (en) { return en.id === editingId ? Object.assign({}, en, fields) : en; });
        showToast("बदल जतन झाले");
      } else {
        var entry = Object.assign({ id: Date.now() + "-" + Math.random().toString(36).slice(2, 7) }, fields);
        next = entries.concat([entry]);
        showToast("नोंद जमा झाली");
      }
      setEntries(next);
      persist(next);
      resetForm();
      setTab("home");
    }

    function editEntry(id) {
      var en = entries.find(function (x) { return x.id === id; });
      if (!en) return;
      setEditingId(id);
      setForm({
        date: en.date, site: en.site,
        startReading: String(en.startReading || ""), endReading: String(en.endReading || ""),
        rate: String(en.rate || ""), received: String(en.received || ""), diesel: String(en.diesel || ""),
        otherExpenses: (en.otherExpenses && en.otherExpenses.length)
          ? en.otherExpenses.map(function (x) { return { amount: String(x.amount || ""), note: x.note || "" }; })
          : [{ amount: "", note: "" }]
      });
      setTab("new");
    }

    function deleteEntry(id) {
      var next = entries.filter(function (en) { return en.id !== id; });
      setEntries(next);
      persist(next);
      if (editingId === id) { resetForm(); setTab("home"); }
    }

    function doExport() {
      setBackupText(JSON.stringify(entries));
      showToast("बॅकअप तयार झाला — मजकूर कॉपी करून सुरक्षित ठिकाणी ठेवा");
    }
    function doExportFile() {
      try {
        var json = JSON.stringify(entries, null, 2);
        var blob = new Blob([json], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var nowIso = new Date().toISOString();
        var fileStamp = todayStr();
        var a = document.createElement("a");
        a.href = url;
        a.download = "jcb-hisab-backup-" + fileStamp + ".json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
        try { window.localStorage.setItem("jcb-hisab-last-backup", fileStamp); } catch (err) {}
        var logEntry = { date: nowIso, count: entries.length };
        var newLog = [logEntry].concat(backupLog).slice(0, 10);
        setBackupLog(newLog);
        try { window.localStorage.setItem(BACKUP_LOG_KEY, JSON.stringify(newLog)); } catch (err) {}
        showToast("फाईल डाउनलोड झाली — फोनच्या Downloads फोल्डरमध्ये सेव्ह आहे");
      } catch (err) {
        showToast("फाईल डाउनलोड करता आली नाही: " + err.message);
      }
    }
    function doImport() {
      var txt = backupText.trim();
      if (!txt) { showToast("कृपया आधी बॅकअपचा मजकूर पेस्ट करा"); return; }
      try {
        var restored = JSON.parse(txt);
        if (!Array.isArray(restored)) throw new Error("bad");
        setEntries(restored);
        persist(restored);
        showToast("नोंदी परत आणल्या — " + restored.length + " नोंदी");
        setTab("history");
      } catch (err) {
        showToast("मजकूर वाचता आला नाही, तपासून पुन्हा पेस्ट करा");
      }
    }
    function doImportFile(ev) {
      var file = ev.target.files && ev.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var restored = JSON.parse(reader.result);
          if (!Array.isArray(restored)) throw new Error("bad");
          setEntries(restored);
          persist(restored);
          showToast("फाईलमधून नोंदी परत आणल्या — " + restored.length + " नोंदी");
          setTab("history");
        } catch (err) {
          showToast("ही फाईल वाचता आली नाही, योग्य बॅकअप फाईल निवडा");
        }
      };
      reader.readAsText(file);
      ev.target.value = "";
    }

    var totalBilled = entries.reduce(function (s, en) { return s + en.amount; }, 0);
    var totalReceived = entries.reduce(function (s, en) { return s + en.received; }, 0);
    var totalExpense = entries.reduce(function (s, en) { return s + en.diesel + en.other; }, 0);
    var netProfit = totalReceived - totalExpense;
    var pending = Math.max(totalBilled - totalReceived, 0);

    var cm = (function () {
      var d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    })();
    var monthHours = entries.filter(function (en) { return monthKey(en.date) === cm; }).reduce(function (s, en) { return s + en.hours; }, 0);
    var lifetimeHours = entries.reduce(function (s, en) { return s + en.hours; }, 0);

    var sorted = entries.slice().sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
    var groups = {};
    sorted.forEach(function (en) {
      var k = monthKey(en.date);
      if (!groups[k]) groups[k] = [];
      groups[k].push(en);
    });

    var inputStyle = { width: "100%", background: C.surface2, border: "1px solid " + C.line, color: C.paper, borderRadius: 6, padding: "10px 12px", fontSize: 16, outline: "none" };
    var labelStyle = { display: "block", fontSize: 12, marginBottom: 6, letterSpacing: 0.5, textTransform: "uppercase", fontWeight: 600, color: C.steel };

    var summaryCards = [
      { lbl: "एकूण कमाई", val: fmt(totalBilled), color: C.paper },
      { lbl: "एकूण खर्च", val: fmt(totalExpense), color: C.rust },
      { lbl: "निव्वळ नफा", val: fmt(netProfit), color: netProfit >= 0 ? C.green : C.rust },
      { lbl: "थकीत रक्कम", val: fmt(pending), color: C.yellow }
    ];

    var recentEntries = sorted.slice(0, 3);
    var recentEl = e("div", { style: { marginTop: 24 } },
      e("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 } },
        e("div", { style: { fontSize: 12, fontWeight: 700, letterSpacing: 0.5, textTransform: "uppercase", color: C.yellow } }, "अलीकडील नोंदी"),
        entries.length > 0 ? e("button", {
          onClick: function () { setTab("history"); },
          style: { fontSize: 12, color: C.steel, background: "transparent", border: "none", cursor: "pointer", textDecoration: "underline" }
        }, "सर्व पहा →") : null
      ),
      recentEntries.length === 0
        ? e("div", { style: { textAlign: "center", fontSize: 14, padding: "28px 0", lineHeight: 1.6, color: C.steel, background: C.surface, borderRadius: 12, border: "1px solid " + C.line } },
            "अजून कोणतीही नोंद नाही.", e("br"), "खाली '+' दाबून पहिली नोंद जमा करा."
          )
        : e("div", { style: { display: "flex", flexDirection: "column", gap: 8 } },
            recentEntries.map(function (en) {
              var dateFmt = new Date(en.date).toLocaleDateString("mr-IN", { day: "2-digit", month: "short" });
              var due = en.amount - en.received;
              return e("div", {
                key: en.id, onClick: function () { setTab("history"); },
                style: { display: "flex", justifyContent: "space-between", alignItems: "center", borderRadius: 10, padding: "10px 12px", background: C.surface, border: "1px solid " + C.line, borderLeft: "3px solid " + C.yellow, cursor: "pointer" }
              },
                e("div", null,
                  e("div", { style: { fontWeight: 700, fontSize: 14 } }, en.site),
                  e("div", { style: { fontSize: 12, color: C.steel } }, dateFmt + " · " + en.hours + " तास")
                ),
                e("div", { style: { textAlign: "right" } },
                  e("div", { style: { fontWeight: 700, fontSize: 15 } }, fmt(en.amount)),
                  due > 0 ? e("div", { style: { fontSize: 11, color: C.yellow } }, "थकीत " + fmt(due)) : e("div", { style: { fontSize: 11, color: C.green } }, "पूर्ण")
                )
              );
            })
          )
    );

    var quickAddEl = e("button", {
      type: "button", onClick: function () { resetForm(); setTab("new"); },
      style: { width: "100%", fontWeight: 700, fontSize: 15, borderRadius: 10, padding: "13px 0", marginTop: 20, letterSpacing: 0.3, background: C.yellow, color: C.bg, border: "none", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }
    }, "➕ नवीन नोंद जमा करा");

    var headerEl = e("div", {
      style: { padding: "28px 16px 20px", position: "relative", overflow: "hidden", borderBottom: "3px solid " + C.yellow, background: "linear-gradient(180deg, #1e2320, " + C.bg + ")" }
    },
      e("div", { style: { position: "absolute", right: -40, top: -40, width: 160, height: 160, borderRadius: "50%", border: "22px solid rgba(245,183,0,0.06)" } }),
      e("div", { style: { maxWidth: 576, margin: "0 auto", position: "relative" } },
        e("div", { style: { fontSize: 12, fontWeight: 700, letterSpacing: 2, textTransform: "uppercase", color: C.yellow } }, "दैनिक हिशोब वही"),
        e("h1", { style: { fontSize: 28, fontWeight: 700, marginTop: 4, marginBottom: 4 } }, "जेसीबी हिशोब"),
        e("div", { style: { fontSize: 14, marginBottom: 16, color: C.steel } }, "मशीनचं रोजचं काम आणि पैशाचा हिशोब — एका ठिकाणी"),
        e("div", { style: { display: "flex", alignItems: "center", gap: 12, marginTop: 8 } },
          e("div", { style: { fontSize: 12, textTransform: "uppercase", letterSpacing: 0.5, width: 112, flexShrink: 0, color: C.steel } }, monthLabel(cm) + " — एकूण तास"),
          e(DigitMeter, { value: monthHours, digits: 4 }),
          e("div", { style: { fontSize: 12, alignSelf: "flex-end", color: C.steel } }, "तास")
        ),
        e("div", { style: { display: "flex", alignItems: "center", gap: 12, marginTop: 8 } },
          e("div", { style: { fontSize: 12, textTransform: "uppercase", letterSpacing: 0.5, width: 112, flexShrink: 0, color: C.steel } }, "एकूण सर्विस तास (सर्व काळ)"),
          e(DigitMeter, { value: lifetimeHours, digits: 5 }),
          e("div", { style: { fontSize: 12, alignSelf: "flex-end", color: C.steel } }, "तास")
        ),
        e("div", { style: { marginTop: 12, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" } },
          e("div", {
            style: {
              display: "inline-block", fontSize: 12, fontWeight: 700, padding: "6px 10px", borderRadius: 6,
              background: saveStatus.ok ? "rgba(122,166,99,0.1)" : "rgba(193,68,14,0.15)",
              color: saveStatus.ok ? C.green : C.rust
            }
          }, saveStatus.msg),
          (!saveStatus.ok && entries.length > 0) ? e("button", {
            onClick: retrySave,
            style: { fontSize: 12, fontWeight: 700, padding: "6px 10px", borderRadius: 6, border: "1px solid " + C.yellow, color: C.yellow, background: "transparent" }
          }, "पुन्हा जतन करा") : null
        )
      )
    );

    var summaryEl = e("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 20 } },
      summaryCards.map(function (c, i) {
        return e("div", { key: i, style: { borderRadius: 12, padding: 14, background: C.surface, border: "1px solid " + C.line } },
          e("div", { style: { fontSize: 12, letterSpacing: 0.5, color: C.steel } }, c.lbl),
          e("div", { style: { fontWeight: 700, fontSize: 22, marginTop: 4, color: c.color, fontVariantNumeric: "tabular-nums" } }, c.val)
        );
      })
    );

    var otherExpenseRows = e("div", { style: { display: "flex", flexDirection: "column", gap: 8, marginBottom: 10 } },
      form.otherExpenses.map(function (row, idx) {
        return e("div", { key: idx, style: { display: "flex", gap: 8, alignItems: "center" } },
          e("input", {
            type: "number",
            style: { borderRadius: 6, padding: "10px 12px", fontSize: 16, width: 96, flexShrink: 0, outline: "none", background: C.surface2, border: "1px solid " + C.line, color: C.paper },
            placeholder: "रक्कम", value: row.amount,
            onChange: function (ev) { updateOtherRow(idx, "amount", ev.target.value); }
          }),
          e("input", {
            type: "text",
            style: { borderRadius: 6, padding: "10px 12px", fontSize: 16, flex: 1, outline: "none", background: C.surface2, border: "1px solid " + C.line, color: C.paper },
            placeholder: "कशासाठी? उदा. ऑइल, जेवण", value: row.note,
            onChange: function (ev) { updateOtherRow(idx, "note", ev.target.value); }
          }),
          e("button", {
            type: "button", onClick: function () { removeOtherRow(idx); },

          color: isActive ? C.yellow : C.steel, cursor: "pointer"
        }
      },
        e("span", { style: { fontSize: 19, lineHeight: 1, filter: isActive ? "none" : "grayscale(60%) opacity(0.8)" } }, it.icon),
        e("span", { style: { fontSize: 10.5, fontWeight: isActive ? 700 : 500, marginTop: 2 } }, it.label),
        isActive ? e("span", { style: { position: "absolute", bottom: 0, left: "50%", transform: "translateX(-50%)", width: 28, height: 3, borderRadius: 2, background: C.yellow } }) : null
      );
    }));
  }

  var MAX_ATTEMPTS_BEFORE_LOCK = 5;
  var LOCK_SCHEDULE_SEC = [30, 60, 120, 300];
  var BG_RELOCK_SEC = 30;
  var ATTEMPTS_KEY = "jcb-hisab-pin-attempts";
  var LOCK_UNTIL_KEY = "jcb-hisab-pin-lockuntil";
  var BG_TIME_KEY = "jcb-hisab-bg-time";

  function formatCountdown(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    if (m > 0) return m + ":" + String(s).padStart(2, "0") + " मिनिट";
    return sec + " सेकंद";
  }

  function PinGate(props) {
    var storedState = useState(null); var stored = storedState[0]; var setStored = storedState[1];
    var loadedState = useState(false); var loaded = loadedState[0]; var setLoaded = loadedState[1];
    var unlockedState = useState(false); var unlocked = unlockedState[0]; var setUnlocked = unlockedState[1];
    var stageState = useState("set"); var stage = stageState[0]; var setStage = stageState[1]; // set | confirm | enter
    var inputState = useState(""); var input = inputState[0]; var setInput = inputState[1];
    var firstPinState = useState(""); var firstPin = firstPinState[0]; var setFirstPin = firstPinState[1];
    var errorState = useState(""); var error = errorState[0]; var setError = errorState[1];
    var shakeState = useState(false); var shake = shakeState[0]; var setShake = shakeState[1];
    var helpOpenState = useState(false); var helpOpen = helpOpenState[0]; var setHelpOpen = helpOpenState[1];
    var lockUntilState = useState(0); var lockUntil = lockUntilState[0]; var setLockUntil = lockUntilState[1];
    var secondsLeftState = useState(0); var secondsLeft = secondsLeftState[0]; var setSecondsLeft = secondsLeftState[1];

    useEffect(function () {
      var p = null, lu = null;
      try { p = window.localStorage.getItem(PIN_KEY); } catch (err) {}
      try { lu = window.localStorage.getItem(LOCK_UNTIL_KEY); } catch (err) {}
      setStored(p);
      setStage(p ? "enter" : "set");
      var luNum = lu ? parseInt(lu, 10) : 0;
      if (luNum > Date.now()) setLockUntil(luNum);
      setLoaded(true);
    }, []);

    // countdown ticker while locked
    useEffect(function () {
      if (!lockUntil) { setSecondsLeft(0); return; }
      var tick = function () {
        var remain = Math.ceil((lockUntil - Date.now()) / 1000);
        if (remain <= 0) {
          setSecondsLeft(0);
          setLockUntil(0);
          try { window.localStorage.removeItem(LOCK_UNTIL_KEY); } catch (err) {}
        } else {
          setSecondsLeft(remain);
        }
      };
      tick();
      var iv = setInterval(tick, 1000);
      return function () { clearInterval(iv); };
    }, [lockUntil]);

    // auto re-lock when returning from background after BG_RELOCK_SEC
    useEffect(function () {
      function onVisChange() {
        if (document.hidden) {
          try { window.localStorage.setItem(BG_TIME_KEY, String(Date.now())); } catch (err) {}
        } else {
          var bgStr = null;
          try { bgStr = window.localStorage.getItem(BG_TIME_KEY); } catch (err) {}
          if (bgStr) {
            var elapsed = (Date.now() - parseInt(bgStr, 10)) / 1000;
            if (elapsed >= BG_RELOCK_SEC) {
              setUnlocked(false);
              var freshPin = null;
              try { freshPin = window.localStorage.getItem(PIN_KEY); } catch (err) {}
              setStage(freshPin ? "enter" : "set");
              setInput("");
              setError("");
              setHelpOpen(false);
            }
            try { window.localStorage.removeItem(BG_TIME_KEY); } catch (err) {}
          }
        }
      }
      document.addEventListener("visibilitychange", onVisChange);
      return function () { document.removeEventListener("visibilitychange", onVisChange); };
    }, []);

    function registerFailedAttempt() {
      var n = 0;
      try { n = parseInt(window.localStorage.getItem(ATTEMPTS_KEY) || "0", 10) + 1; } catch (err) { n = 1; }
      try { window.localStorage.setItem(ATTEMPTS_KEY, String(n)); } catch (err) {}
      if (n >= MAX_ATTEMPTS_BEFORE_LOCK) {
        var idx = Math.min(n - MAX_ATTEMPTS_BEFORE_LOCK, LOCK_SCHEDULE_SEC.length - 1);
        var lockSec = LOCK_SCHEDULE_SEC[idx];
        var until = Date.now() + lockSec * 1000;
        try { window.localStorage.setItem(LOCK_UNTIL_KEY, String(until)); } catch (err) {}
        setLockUntil(until);
      }
    }
    function clearFailedAttempts() {
      try { window.localStorage.removeItem(ATTEMPTS_KEY); } catch (err) {}
      try { window.localStorage.removeItem(LOCK_UNTIL_KEY); } catch (err) {}
      setLockUntil(0);
    }

    function onDigit(d) {
      if (lockUntil) return;
      if (input.length >= PIN_LEN) return;
      var next = input + d;
      setError("");
      if (next.length === PIN_LEN) {
        if (stage === "set") {
          setFirstPin(next);
          setInput("");
          setStage("confirm");
        } else if (stage === "confirm") {
          if (next === firstPin) {
            try { window.localStorage.setItem(PIN_KEY, next); } catch (err) {}
            setStored(next);
            setInput("");
            clearFailedAttempts();
            setUnlocked(true);
          } else {
            setError("पिन जुळत नाही, पुन्हा प्रयत्न करा");
            setFirstPin("");
            setShake(true);
            setTimeout(function () { setShake(false); setInput(""); setStage("set"); }, 350);
          }
        } else { // enter
          if (next === stored) {
            setInput("");
            clearFailedAttempts();
            setUnlocked(true);
          } else {
            registerFailedAttempt();
            setError("चुकीचा पिन");
            setShake(true);
            setTimeout(function () { setShake(false); setInput(""); }, 350);
          }
        }
      } else {
        setInput(next);
      }
    }
    function onBackspace() {
      setInput(function (v) { return v.slice(0, -1); });
    }

    if (!loaded) return null;
    if (unlocked) return props.children;

    if (lockUntil && secondsLeft > 0) {
      return e("div", {
        style: { minHeight: "100vh", background: C.bg, color: C.paper, fontFamily: "'Noto Sans Devanagari','Noto Sans',sans-serif", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }
      },
        e("div", { style: { fontSize: 12, fontWeight: 700, letterSpacing: 2, textTransform: "uppercase", color: C.yellow, marginBottom: 8 } }, "जेसीबी हिशोब"),
        e("div", { style: { fontSize: 40, marginBottom: 10 } }, "🔒"),
        e("div", { style: { fontSize: 18, fontWeight: 700, marginBottom: 6, textAlign: "center" } }, "खूप चुकीचे प्रयत्न झाले"),
        e("div", { style: { fontSize: 14, color: C.steel, textAlign: "center", maxWidth: 260 } },
          e("b", { style: { color: C.rust } }, formatCountdown(secondsLeft)),
          " नंतर पुन्हा प्रयत्न करा"
        )
      );
    }

    var title = stage === "set" ? "नवीन पिन सेट करा" : stage === "confirm" ? "पिन पुन्हा टाका" : "पिन टाका";
    var sub = stage === "set" ? "अ‍ॅप उघडण्यासाठी 4 अंकी पिन तयार करा" : stage === "confirm" ? "खात्री करण्यासाठी तोच पिन पुन्हा टाका" : "अ‍ॅप उघडण्यासाठी तुमचा पिन टाका";

    return e("div", {
      style: { minHeight: "100vh", background: C.bg, color: C.paper, fontFamily: "'Noto Sans Devanagari','Noto Sans',sans-serif", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }
    },
      e("div", { style: { fontSize: 12, fontWeight: 700, letterSpacing: 2, textTransform: "uppercase", color: C.yellow, marginBottom: 8 } }, "जेसीबी हिशोब"),
      e("div", { style: { fontSize: 20, fontWeight: 700, marginBottom: 4, textAlign: "center" } }, title),
      e("div", { style: { fontSize: 13, color: C.steel, marginBottom: 8, textAlign: "center" } }, sub),
      e("div", {
        style: { transform: shake ? "translateX(6px)" : "translateX(0)", transition: "transform 0.06s" }
      }, e(Dots, { filled: input.length, count: PIN_LEN })),
      error ? e("div", { style: { color: C.rust, fontSize: 13, marginBottom: 12, textAlign: "center" } }, error) : null,
      e(Keypad, { onDigit: onDigit, onBackspace: onBackspace }),
      stage === "enter" && !helpOpen ? e("button", {
        type: "button", onClick: function () { setHelpOpen(true); },
        style: { marginTop: 22, fontSize: 13, color: C.steel, background: "transparent", border: "none", textDecoration: "underline", cursor: "pointer" }
      }, "पिन विसरलात?") : null,
      stage === "enter" && helpOpen ? e("div", {
        style: { marginTop: 20, maxWidth: 300, background: C.surface, border: "1px solid " + C.line, borderRadius: 10, padding: 14 }
      },
        e("div", { style: { fontSize: 13, lineHeight: 1.7, color: C.steel } },
          "सुरक्षेसाठी इथून पिन रीसेट करता येत नाही.",
          e("br"), e("br"),
          e("b", { style: { color: C.rust } }, "पिन नीट लक्षात ठेवा"),
          " — विसरल्यास जुन्या नोंदी परत मिळवण्यासाठी तुमच्या बॅकअप फाईलचीच गरज लागेल."
        ),
        e("button", {
          type: "button", onClick: function () { setHelpOpen(false); },
          style: { marginTop: 10, fontSize: 12, color: C.yellow, background: "transparent", border: "none", textDecoration: "underline", cursor: "pointer" }
        }, "बंद करा")
      ) : null
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(
    e(PinGate, null, e(JcbHisab))
  );
})();
</script>
</body>
</html>
