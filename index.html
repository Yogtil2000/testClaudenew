<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>जेसीबी हिशोब</title>
<meta name="theme-color" content="#181c1a" />
<meta name="description" content="जेसीबी मशीनचं रोजचं काम आणि पैशाचा हिशोब ठेवण्यासाठी अ‍ॅप" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="JCB हिशोब" />
<link rel="manifest" href="manifest.json" />

<!-- App icon (yellow J glyph on dark bg), used for home-screen / APK icon -->
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #181c1a; }
  .fi { display:inline-flex; vertical-align:-2px; }
  #fallback {
    display: none; min-height: 100vh; align-items: center; justify-content: center;
    color: #f3efe4; font-family: sans-serif; text-align: center; padding: 24px;
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="fallback">
  <div>
    <div style="font-size:18px;font-weight:bold;margin-bottom:8px;">लोड होण्यात अडचण आली</div>
    <div style="font-size:14px;color:#8a988f;">कृपया इंटरनेट कनेक्शन तपासा आणि पान पुन्हा उघडा (रिफ्रेश करा).</div>
  </div>
</div>
<script>
  // If React hasn't mounted anything into #root within 6 seconds, something
  // failed to load (usually a network/CDN issue) — show a plain-language fallback
  // instead of leaving a blank screen.
  window.addEventListener('load', function () {
    setTimeout(function () {
      var root = document.getElementById('root');
      if (!root || root.children.length === 0) {
        document.getElementById('fallback').style.display = 'flex';
      }
    }, 6000);
  });
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

/* ---------- local persistent storage (replaces Claude's window.storage) ---------- */
const LS_KEY = "jcb-hisab-entries-v1";
const localStore = {
  async get() {
    try {
      const raw = window.localStorage.getItem(LS_KEY);
      return raw ? { value: raw } : null;
    } catch (e) {
      throw e;
    }
  },
  async set(value) {
    window.localStorage.setItem(LS_KEY, value);
    return { value };
  }
};

const monthNames = ["जाने", "फेब्रु", "मार्च", "एप्रिल", "मे", "जून", "जुलै", "ऑगस्ट", "सप्टें", "ऑक्टो", "नोव्हें", "डिसें"];

const C = {
  bg: "#181c1a",
  surface: "#232823",
  surface2: "#2b322b",
  line: "#3a423a",
  yellow: "#f5b700",
  rust: "#c1440e",
  steel: "#8a988f",
  paper: "#f3efe4",
  green: "#7aa663",
  black: "#0f120f",
};

function fmt(n) {
  return "₹" + Math.round(n || 0).toLocaleString("en-IN");
}
function monthKey(dateStr) {
  const d = new Date(dateStr);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}
function monthLabel(key) {
  const [y, m] = key.split("-");
  return monthNames[parseInt(m) - 1] + " " + y;
}
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function emptyForm() {
  return {
    date: todayStr(),
    site: "",
    startReading: "",
    endReading: "",
    rate: "",
    received: "",
    diesel: "",
    otherExpenses: [{ amount: "", note: "" }],
  };
}

function DigitMeter({ value, digits }) {
  const str = String(Math.max(0, Math.round(value))).padStart(digits, "0").split("");
  return (
    <div
      className="flex rounded p-1.5"
      style={{ display: "flex", background: C.black, border: "2px solid #000", boxShadow: "inset 0 2px 6px rgba(0,0,0,0.6)", borderRadius: 6, padding: 6 }}
    >
      {str.map((d, i) => (
        <div
          key={i}
          style={{
            fontWeight: 800, fontSize: 24, width: 20, textAlign: "center", margin: "0 1px",
            borderRadius: 2, color: C.yellow, background: "#141814", textShadow: "0 0 6px rgba(245,183,0,0.35)"
          }}
        >
          {d}
        </div>
      ))}
    </div>
  );
}

function JcbHisab() {
  const [entries, setEntries] = useState([]);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState(emptyForm());
  const [saveStatus, setSaveStatus] = useState({ ok: true, msg: "लोड होत आहे…" });
  const [toast, setToast] = useState("");
  const [backupText, setBackupText] = useState("");

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(""), 2500);
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const res = await localStore.get();
        const data = res && res.value ? JSON.parse(res.value) : [];
        setEntries(data);
        setSaveStatus({ ok: true, msg: "✓ " + data.length + " जुन्या नोंदी सापडल्या" });
      } catch (e) {
        setEntries([]);
        setSaveStatus({ ok: true, msg: "✓ जतन सुविधा तयार आहे (अजून नोंदी नाहीत)" });
      }
    })();
  }, []);

  const persist = useCallback(
    async (list) => {
      try {
        await localStore.set(JSON.stringify(list));
        setSaveStatus({ ok: true, msg: "✓ जतन झाले (या फोनवर)" });
      } catch (e) {
        setSaveStatus({ ok: false, msg: "⚠️ जतन करताना अडचण: " + e.message });
        showToast("जतन करताना अडचण आली — खाली 'पुन्हा जतन करा' दाबा");
      }
    },
    [showToast]
  );

  const retrySave = useCallback(() => persist(entries), [persist, entries]);

  const startReadingNum = parseFloat(form.startReading) || 0;
  const endReadingNum = parseFloat(form.endReading) || 0;
  const rateNum = parseFloat(form.rate) || 0;
  const hoursCalc = Math.max(endReadingNum - startReadingNum, 0);
  const amountCalc = hoursCalc * rateNum;

  function updateOtherRow(idx, field, value) {
    setForm((f) => {
      const rows = [...f.otherExpenses];
      rows[idx] = { ...rows[idx], [field]: value };
      return { ...f, otherExpenses: rows };
    });
  }
  function addOtherRow() {
    setForm((f) => ({ ...f, otherExpenses: [...f.otherExpenses, { amount: "", note: "" }] }));
  }
  function removeOtherRow(idx) {
    setForm((f) => ({ ...f, otherExpenses: f.otherExpenses.filter((_, i) => i !== idx) }));
  }
  function resetForm() {
    setForm(emptyForm());
    setEditingId(null);
  }

  function handleSubmit() {
    const dateVal = form.date || todayStr();
    const siteVal = form.site.trim() || "नोंद";
    const otherExpenses = form.otherExpenses
      .filter((x) => (parseFloat(x.amount) || 0) > 0 || x.note.trim())
      .map((x) => ({ amount: parseFloat(x.amount) || 0, note: x.note.trim() }));
    const otherTotal = otherExpenses.reduce((s, x) => s + x.amount, 0);

    const fields = {
      date: dateVal,
      site: siteVal,
      startReading: startReadingNum,
      endReading: endReadingNum,
      hours: hoursCalc,
      rate: rateNum,
      amount: amountCalc,
      received: parseFloat(form.received) || 0,
      diesel: parseFloat(form.diesel) || 0,
      otherExpenses,
      other: otherTotal,
    };

    let next;
    if (editingId) {
      next = entries.map((en) => (en.id === editingId ? { ...en, ...fields } : en));
      showToast("बदल जतन झाले");
    } else {
      const entry = { id: Date.now() + "-" + Math.random().toString(36).slice(2, 7), ...fields };
      next = [...entries, entry];
      showToast("नोंद जमा झाली");
    }
    setEntries(next);
    persist(next);
    resetForm();
  }

  function editEntry(id) {
    const en = entries.find((x) => x.id === id);
    if (!en) return;
    setEditingId(id);
    setForm({
      date: en.date,
      site: en.site,
      startReading: String(en.startReading || ""),
      endReading: String(en.endReading || ""),
      rate: String(en.rate || ""),
      received: String(en.received || ""),
      diesel: String(en.diesel || ""),
      otherExpenses:
        en.otherExpenses && en.otherExpenses.length
          ? en.otherExpenses.map((x) => ({ amount: String(x.amount || ""), note: x.note || "" }))
          : [{ amount: "", note: "" }],
    });
    document.getElementById("entryForm")?.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function deleteEntry(id) {
    const next = entries.filter((en) => en.id !== id);
    setEntries(next);
    persist(next);
    if (editingId === id) resetForm();
  }

  function doExport() {
    setBackupText(JSON.stringify(entries));
    showToast("बॅकअप तयार झाला — मजकूर कॉपी करून सुरक्षित ठिकाणी ठेवा");
  }
  function doImport() {
    const txt = backupText.trim();
    if (!txt) {
      showToast("कृपया आधी बॅकअपचा मजकूर पेस्ट करा");
      return;
    }
    try {
      const restored = JSON.parse(txt);
      if (!Array.isArray(restored)) throw new Error("bad");
      setEntries(restored);
      persist(restored);
      showToast("नोंदी परत आणल्या — " + restored.length + " नोंदी");
    } catch (e) {
      showToast("मजकूर वाचता आला नाही, तपासून पुन्हा पेस्ट करा");
    }
  }

  const totalBilled = entries.reduce((s, en) => s + en.amount, 0);
  const totalReceived = entries.reduce((s, en) => s + en.received, 0);
  const totalExpense = entries.reduce((s, en) => s + en.diesel + en.other, 0);
  const netProfit = totalReceived - totalExpense;
  const pending = Math.max(totalBilled - totalReceived, 0);

  const cm = (() => {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  })();
  const monthHours = entries.filter((en) => monthKey(en.date) === cm).reduce((s, en) => s + en.hours, 0);
  const lifetimeHours = entries.reduce((s, en) => s + en.hours, 0);

  const sorted = [...entries].sort((a, b) => new Date(b.date) - new Date(a.date));
  const groups = {};
  sorted.forEach((en) => {
    const k = monthKey(en.date);
    if (!groups[k]) groups[k] = [];
    groups[k].push(en);
  });

  const inputStyle = {
    width: "100%", background: C.surface2, border: `1px solid ${C.line}`, color: C.paper,
    borderRadius: 6, padding: "10px 12px", fontSize: 16, outline: "none"
  };
  const labelStyle = { display: "block", fontSize: 12, marginBottom: 6, letterSpacing: 0.5, textTransform: "uppercase", fontWeight: 600, color: C.steel };

  return (
    <div style={{ minHeight: "100vh", paddingBottom: 64, background: C.bg, color: C.paper, fontFamily: "'Noto Sans Devanagari','Noto Sans',sans-serif" }}>
      {/* Header */}
      <div style={{ padding: "28px 16px 20px", position: "relative", overflow: "hidden", borderBottom: `3px solid ${C.yellow}`, background: `linear-gradient(180deg, #1e2320, ${C.bg})` }}>
        <div style={{ position: "absolute", right: -40, top: -40, width: 160, height: 160, borderRadius: "50%", border: "22px solid rgba(245,183,0,0.06)" }} />
        <div style={{ maxWidth: 576, margin: "0 auto", position: "relative" }}>
          <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 2, textTransform: "uppercase", color: C.yellow }}>दैनिक हिशोब वही</div>
          <h1 style={{ fontSize: 28, fontWeight: 700, marginTop: 4, marginBottom: 4 }}>जेसीबी हिशोब</h1>
          <div style={{ fontSize: 14, marginBottom: 16, color: C.steel }}>मशीनचं रोजचं काम आणि पैशाचा हिशोब — एका ठिकाणी</div>

          <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 8 }}>
            <div style={{ fontSize: 12, textTransform: "uppercase", letterSpacing: 0.5, width: 112, flexShrink: 0, color: C.steel }}>{monthLabel(cm)} — एकूण तास</div>
            <DigitMeter value={monthHours} digits={4} />
            <div style={{ fontSize: 12, alignSelf: "flex-end", color: C.steel }}>तास</div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 8 }}>
            <div style={{ fontSize: 12, textTransform: "uppercase", letterSpacing: 0.5, width: 112, flexShrink: 0, color: C.steel }}>एकूण सर्विस तास (सर्व काळ)</div>
            <DigitMeter value={lifetimeHours} digits={5} />
            <div style={{ fontSize: 12, alignSelf: "flex-end", color: C.steel }}>तास</div>
          </div>

          <div style={{ marginTop: 12, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            <div style={{
              display: "inline-block", fontSize: 12, fontWeight: 700, padding: "6px 10px", borderRadius: 6,
              background: saveStatus.ok ? "rgba(122,166,99,0.1)" : "rgba(193,68,14,0.15)",
              color: saveStatus.ok ? C.green : C.rust
            }}>
              {saveStatus.msg}
            </div>
            {!saveStatus.ok && entries.length > 0 && (
              <button onClick={retrySave} style={{ fontSize: 12, fontWeight: 700, padding: "6px 10px", borderRadius: 6, border: `1px solid ${C.yellow}`, color: C.yellow, background: "transparent" }}>
                पुन्हा जतन करा
              </button>
            )}
          </div>
        </div>
      </div>

      <div style={{ maxWidth: 576, margin: "0 auto", padding: "0 14px" }}>
        {/* Summary cards */}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 20 }}>
          {[
            { lbl: "एकूण कमाई", val: fmt(totalBilled), color: C.paper },
            { lbl: "एकूण खर्च", val: fmt(totalExpense), color: C.rust },
            { lbl: "निव्वळ नफा", val: fmt(netProfit), color: netProfit >= 0 ? C.green : C.rust },
            { lbl: "थकीत रक्कम", val: fmt(pending), color: C.yellow },
          ].map((c, i) => (
            <div key={i} style={{ borderRadius: 12, padding: 14, background: C.surface, border: `1px solid ${C.line}` }}>
              <div style={{ fontSize: 12, letterSpacing: 0.5, color: C.steel }}>{c.lbl}</div>
              <div style={{ fontWeight: 700, fontSize: 22, marginTop: 4, color: c.color, fontVariantNumeric: "tabular-nums" }}>{c.val}</div>
            </div>
          ))}
        </div>

        {/* Form */}
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 24, marginBottom: 10 }}>
          <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 0.5, textTransform: "uppercase", color: C.yellow }}>
            {editingId ? "नोंद बदला" : "नवीन नोंद"}
          </div>
          <div style={{ flex: 1, height: 1, background: C.line }} />
        </div>

        <div id="entryForm" style={{ borderRadius: 12, padding: 16, background: C.surface, border: `1px solid ${C.line}` }}>
          <label style={labelStyle}>तारीख</label>
          <input type="date" style={{ ...inputStyle, marginBottom: 12 }} value={form.date} onChange={(e) => setForm((f) => ({ ...f, date: e.target.value }))} />

          <label style={labelStyle}>ग्राहक / साईटचे नाव</label>
          <input type="text" style={{ ...inputStyle, marginBottom: 12 }} placeholder="उदा. पाटील साहेब — शेत खोदाई" value={form.site} onChange={(e) => setForm((f) => ({ ...f, site: e.target.value }))} />

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>
            <div>
              <label style={labelStyle}>मशीन चालू रिडींग</label>
              <input type="number" style={inputStyle} placeholder="उदा. 1230.5" value={form.startReading} onChange={(e) => setForm((f) => ({ ...f, startReading: e.target.value }))} />
            </div>
            <div>
              <label style={labelStyle}>मशीन बंद रिडींग</label>
              <input type="number" style={inputStyle} placeholder="उदा. 1236.5" value={form.endReading} onChange={(e) => setForm((f) => ({ ...f, endReading: e.target.value }))} />
            </div>
          </div>

          <label style={labelStyle}>तासाचा दर (₹)</label>
          <input type="number" style={{ ...inputStyle, marginBottom: 12 }} placeholder="उदा. 800" value={form.rate} onChange={(e) => setForm((f) => ({ ...f, rate: e.target.value }))} />

          <div style={{ borderRadius: 8, padding: "10px 12px", marginBottom: 8, display: "flex", justifyContent: "space-between", fontSize: 14, background: C.surface2, border: `1px dashed ${C.line}`, color: C.steel }}>
            <span>एकूण तास</span>
            <b style={{ fontWeight: 700, color: C.yellow }}>{hoursCalc.toFixed(1)}</b>
          </div>
          <div style={{ borderRadius: 8, padding: "10px 12px", marginBottom: 14, display: "flex", justifyContent: "space-between", fontSize: 14, background: C.surface2, border: `1px dashed ${C.line}`, color: C.steel }}>
            <span>एकूण रक्कम</span>
            <b style={{ fontWeight: 700, fontSize: 18, color: C.yellow }}>{fmt(amountCalc)}</b>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>
            <div>
              <label style={labelStyle}>मिळालेली रक्कम (₹)</label>
              <input type="number" style={inputStyle} placeholder="0" value={form.received} onChange={(e) => setForm((f) => ({ ...f, received: e.target.value }))} />
            </div>
            <div>
              <label style={labelStyle}>डिझेल खर्च (₹)</label>
              <input type="number" style={inputStyle} placeholder="0" value={form.diesel} onChange={(e) => setForm((f) => ({ ...f, diesel: e.target.value }))} />
            </div>
          </div>

          <label style={labelStyle}>इतर खर्च</label>
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 10 }}>
            {form.otherExpenses.map((row, idx) => (
              <div key={idx} style={{ display: "flex", gap: 8, alignItems: "center" }}>
                <input type="number" style={{ borderRadius: 6, padding: "10px 12px", fontSize: 16, width: 96, flexShrink: 0, outline: "none", background: C.surface2, border: `1px solid ${C.line}`, color: C.paper }} placeholder="रक्कम" value={row.amount} onChange={(e) => updateOtherRow(idx, "amount", e.target.value)} />
                <input type="text" style={{ borderRadius: 6, padding: "10px 12px", fontSize: 16, flex: 1, outline: "none", background: C.surface2, border: `1px solid ${C.line}`, color: C.paper }} placeholder="कशासाठी? उदा. ऑइल, जेवण" value={row.note} onChange={(e) => updateOtherRow(idx, "note", e.target.value)} />
                <button type="button" onClick={() => removeOtherRow(idx)} style={{ flexShrink: 0, width: 36, height: 36, display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 6, border: `1px solid ${C.line}`, color: C.steel, background: "transparent" }}>✕</button>
              </div>
            ))}
          </div>
          <button type="button" onClick={addOtherRow} style={{ width: "100%", fontSize: 14, borderRadius: 8, padding: "10px 0", marginBottom: 16, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, border: `1px dashed ${C.line}`, color: C.steel, background: "transparent" }}>
            + खर्च जोडा
          </button>

          <button type="button" onClick={handleSubmit} style={{ width: "100%", fontWeight: 700, fontSize: 16, borderRadius: 8, padding: "12px 0", letterSpacing: 0.5, background: C.yellow, color: C.bg, border: "none" }}>
            {editingId ? "बदल जतन करा" : "नोंद जमा करा"}
          </button>
          {editingId && (
            <button type="button" onClick={resetForm} style={{ width: "100%", borderRadius: 8, padding: "10px 0", marginTop: 8, fontSize: 14, border: `1px solid ${C.line}`, color: C.steel, background: "transparent" }}>
              रद्द करा
            </button>
          )}
        </div>

        {/* Entries list */}
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 24, marginBottom: 10 }}>
          <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 0.5, textTransform: "uppercase", color: C.yellow }}>सर्व नोंदी</div>
          <div style={{ flex: 1, height: 1, background: C.line }} />
        </div>

        {sorted.length === 0 ? (
          <div style={{ textAlign: "center", fontSize: 14, padding: "40px 0", lineHeight: 1.6, color: C.steel }}>
            अजून कोणतीही नोंद नाही.
            <br />
            वरील फॉर्म भरून पहिली नोंद जमा करा.
          </div>
        ) : (
          Object.keys(groups).sort().reverse().map((key) => {
            const list = groups[key];
            const monthProfit = list.reduce((s, en) => s + en.received - en.diesel - en.other, 0);
            return (
              <div key={key}>
                <div style={{ fontSize: 12, marginTop: 16, marginBottom: 8, letterSpacing: 0.5, color: C.steel }}>
                  {monthLabel(key)} · निव्वळ नफा {fmt(monthProfit)}
                </div>
                {list.map((en) => {
                  const due = en.amount - en.received;
                  const netAmt = en.amount - en.diesel - en.other;
                  const dateFmt = new Date(en.date).toLocaleDateString("mr-IN", { day: "2-digit", month: "short" });
                  const otherLines = en.otherExpenses && en.otherExpenses.length ? en.otherExpenses : (en.other > 0 ? [{ amount: en.other, note: "इतर खर्च" }] : []);
                  return (
                    <div key={en.id} style={{ borderRadius: 12, padding: 14, marginBottom: 10, background: C.surface, border: `1px solid ${C.line}`, borderLeft: `4px solid ${C.yellow}` }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8 }}>
                        <div style={{ fontWeight: 700, fontSize: 16 }}>{en.site}</div>
                        <div style={{ fontSize: 12, whiteSpace: "nowrap", color: C.steel }}>{dateFmt}</div>
                      </div>
                      <div style={{ display: "flex", flexWrap: "wrap", gap: "4px 14px", marginTop: 8, fontSize: 14, color: C.steel }}>
                        <span>{en.hours} तास × {fmt(en.rate)}</span>
                        {en.startReading !== undefined && (
                          <span>रिडींग: <b style={{ color: C.paper, fontVariantNumeric: "tabular-nums" }}>{en.startReading} → {en.endReading}</b></span>
                        )}
                        {en.diesel > 0 && (
                          <span>डिझेल: <b style={{ color: C.paper, fontVariantNumeric: "tabular-nums" }}>{fmt(en.diesel)}</b></span>
                        )}
                      </div>
                      {otherLines.length > 0 && (
                        <div style={{ display: "flex", flexDirection: "column", gap: 4, marginTop: 8 }}>
                          {otherLines.map((x, i) => (
                            <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 14, borderRadius: 6, padding: "6px 10px", color: C.steel, background: C.surface2 }}>
                              <span>{x.note || "इतर खर्च"}</span>
                              <b style={{ color: C.paper, fontVariantNumeric: "tabular-nums" }}>{fmt(x.amount)}</b>
                            </div>
                          ))}
                        </div>
                      )}
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 10, paddingTop: 10, borderTop: `1px solid ${C.line}` }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          <span style={{ fontWeight: 700, fontSize: 18 }}>{fmt(en.amount)}</span>
                          {due > 0 ? (
                            <span style={{ fontSize: 12, padding: "2px 8px", borderRadius: 999, background: "rgba(245,183,0,0.15)", color: C.yellow }}>थकीत {fmt(due)}</span>
                          ) : (
                            <span style={{ fontSize: 12, padding: "2px 8px", borderRadius: 999, background: "rgba(122,166,99,0.15)", color: C.green }}>पूर्ण मिळाले</span>
                          )}
                        </div>
                        <div style={{ display: "flex", gap: 8 }}>
                          <button onClick={() => editEntry(en.id)} style={{ fontSize: 12, padding: "6px 10px", borderRadius: 6, display: "flex", alignItems: "center", gap: 4, border: `1px solid ${C.yellow}`, color: C.yellow, background: "transparent" }}>✎ एडिट</button>
                          <button onClick={() => deleteEntry(en.id)} style={{ fontSize: 12, padding: "6px 10px", borderRadius: 6, display: "flex", alignItems: "center", gap: 4, border: `1px solid ${C.line}`, color: C.steel, background: "transparent" }}>🗑 काढून टाका</button>
                        </div>
                      </div>
                      {(en.diesel > 0 || en.other > 0) && (
                        <div style={{ marginTop: 8, paddingTop: 8, textAlign: "right", fontSize: 14, borderTop: `1px dashed ${C.line}`, color: C.steel }}>
                          खर्च वजा जाता निव्वळ:{" "}
                          <b style={{ fontSize: 15, color: netAmt >= 0 ? C.green : C.rust }}>{fmt(netAmt)}</b>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })
        )}

        {/* Backup */}
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 24, marginBottom: 10 }}>
          <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 0.5, textTransform: "uppercase", color: C.yellow }}>डेटा बॅकअप</div>
          <div style={{ flex: 1, height: 1, background: C.line }} />
        </div>
        <div style={{ borderRadius: 12, padding: 14, marginBottom: 24, background: C.surface, border: `1px solid ${C.line}` }}>
          <p style={{ fontSize: 14, lineHeight: 1.6, marginBottom: 12, color: C.steel }}>
            अधूनमधून बॅकअप घेऊन ठेवा — गरज पडल्यास खाली पेस्ट करून परत आणता येईल. (हा डेटा फक्त याच फोनवर, याच ब्राऊझरमध्ये साठवला जातो.)
          </p>
          <button onClick={doExport} style={{ width: "100%", borderRadius: 8, padding: "10px 0", fontSize: 14, marginBottom: 10, border: `1px solid ${C.line}`, color: C.steel, background: "transparent" }}>
            बॅकअप तयार करा
          </button>
          <textarea rows={4} style={{ width: "100%", borderRadius: 6, padding: "10px 12px", fontSize: 12, fontFamily: "monospace", marginBottom: 10, outline: "none", background: C.surface2, border: `1px solid ${C.line}`, color: C.paper }} placeholder="इथे बॅकअपचा मजकूर दिसेल / परत आणण्यासाठी इथे पेस्ट करा" value={backupText} onChange={(e) => setBackupText(e.target.value)} />
          <button onClick={doImport} style={{ width: "100%", borderRadius: 8, padding: "10px 0", fontSize: 14, border: `1px solid ${C.line}`, color: C.steel, background: "transparent" }}>
            वरील मजकुरातून नोंदी परत आणा
          </button>
        </div>
      </div>

      {toast && (
        <div style={{ position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)", fontWeight: 700, padding: "14px 24px", borderRadius: 999, boxShadow: "0 4px 20px rgba(0,0,0,0.4)", fontSize: 16, maxWidth: "90%", textAlign: "center", zIndex: 50, background: C.yellow, border: "2px solid #000", color: C.bg }}>
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<JcbHisab />);
</script>
</body>
</html>
