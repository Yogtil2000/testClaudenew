<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>जेसीबी हिशोब</title>
<meta name="theme-color" content="#181c1a" />
<meta name="description" content="जेसीबी मशीनचं रोजचं काम आणि पैशाचा हिशोब ठेवण्यासाठी अ‍ॅप" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="JCB हिशोब" />
<link rel="manifest" href="manifest.json" />

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #181c1a; }
  #fallback {
    display: none; min-height: 100vh; align-items: center; justify-content: center;
    color: #f3efe4; font-family: sans-serif; text-align: center; padding: 24px;
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="fallback">
  <div>
    <div style="font-size:18px;font-weight:bold;margin-bottom:8px;">लोड होण्यात अडचण आली</div>
    <div style="font-size:14px;color:#8a988f;">कृपया इंटरनेट कनेक्शन तपासा आणि पान पुन्हा उघडा (रिफ्रेश करा).</div>
  </div>
</div>
<script>
  window.addEventListener('load', function () {
    setTimeout(function () {
      var root = document.getElementById('root');
      if (!root || root.children.length === 0) {
        document.getElementById('fallback').style.display = 'flex';
      }
    }, 6000);
  });
</script>

<script>
(function () {
  var e = React.createElement;
  var useState = React.useState;
  var useEffect = React.useEffect;
  var useCallback = React.useCallback;

  /* ---------- local persistent storage (per-device) ---------- */
  var LS_KEY = "jcb-hisab-entries-v1";
  var BACKUP_LOG_KEY = "jcb-hisab-backup-log";
  var localStore = {
    get: function () {
      return new Promise(function (resolve, reject) {
        try {
          var raw = window.localStorage.getItem(LS_KEY);
          resolve(raw ? { value: raw } : null);
        } catch (err) { reject(err); }
      });
    },
    set: function (value) {
      return new Promise(function (resolve, reject) {
        try {
          window.localStorage.setItem(LS_KEY, value);
          resolve({ value: value });
        } catch (err) { reject(err); }
      });
    }
  };

  var monthNames = ["जाने", "फेब्रु", "मार्च", "एप्रिल", "मे", "जून", "जुलै", "ऑगस्ट", "सप्टें", "ऑक्टो", "नोव्हें", "डिसें"];

  var C = {
    bg: "#181c1a", surface: "#232823", surface2: "#2b322b", line: "#3a423a",
    yellow: "#f5b700", rust: "#c1440e", steel: "#8a988f", paper: "#f3efe4",
    green: "#7aa663", black: "#0f120f"
  };

  function fmt(n) { return "₹" + Math.round(n || 0).toLocaleString("en-IN"); }
  function monthKey(dateStr) {
    var d = new Date(dateStr);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  }
  function monthLabel(key) {
    var parts = key.split("-");
    return monthNames[parseInt(parts[1]) - 1] + " " + parts[0];
  }
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function formatLogDate(iso) {
    var d = new Date(iso);
    var datePart = d.toLocaleDateString("mr-IN", { day: "2-digit", month: "short", year: "numeric" });
    var timePart = d.toLocaleTimeString("mr-IN", { hour: "2-digit", minute: "2-digit" });
    return datePart + " · " + timePart;
  }
  function emptyForm() {
    return {
      date: todayStr(), site: "", startReading: "", endReading: "",
      rate: "", received: "", diesel: "", otherExpenses: [{ amount: "", note: "" }]
    };
  }

  function DigitMeter(props) {
    var value = props.value, digits = props.digits;
    var str = String(Math.max(0, Math.round(value))).padStart(digits, "0").split("");
    return e("div", {
      style: { display: "flex", background: C.black, border: "2px solid #000", boxShadow: "inset 0 2px 6px rgba(0,0,0,0.6)", borderRadius: 6, padding: 6 }
    }, str.map(function (d, i) {
      return e("div", {
        key: i,
        style: { fontWeight: 800, fontSize: 24, width: 20, textAlign: "center", margin: "0 1px", borderRadius: 2, color: C.yellow, background: "#141814", textShadow: "0 0 6px rgba(245,183,0,0.35)" }
      }, d);
    }));
  }

  function JcbHisab() {
    var entriesState = useState([]); var entries = entriesState[0]; var setEntries = entriesState[1];
    var editingIdState = useState(null); var editingId = editingIdState[0]; var setEditingId = editingIdState[1];
    var formState = useState(emptyForm()); var form = formState[0]; var setForm = formState[1];
    var saveStatusState = useState({ ok: true, msg: "लोड होत आहे…" }); var saveStatus = saveStatusState[0]; var setSaveStatus = saveStatusState[1];
    var toastState = useState(""); var toast = toastState[0]; var setToast = toastState[1];
    var backupTextState = useState(""); var backupText = backupTextState[0]; var setBackupText = backupTextState[1];
    var backupLogState = useState([]); var backupLog = backupLogState[0]; var setBackupLog = backupLogState[1];

    var showToast = useCallback(function (msg) {
      setToast(msg);
      setTimeout(function () { setToast(""); }, 2500);
    }, []);

    useEffect(function () {
      localStore.get().then(function (res) {
        var data = res && res.value ? JSON.parse(res.value) : [];
        setEntries(data);
        setSaveStatus({ ok: true, msg: "✓ " + data.length + " जुन्या नोंदी सापडल्या" });
      }).catch(function () {
        setEntries([]);
        setSaveStatus({ ok: true, msg: "✓ जतन सुविधा तयार आहे (अजून नोंदी नाहीत)" });
      });
      try {
        var logRaw = window.localStorage.getItem(BACKUP_LOG_KEY);
        setBackupLog(logRaw ? JSON.parse(logRaw) : []);
      } catch (err) {
        setBackupLog([]);
      }
    }, []);

    var persist = useCallback(function (list) {
      return localStore.set(JSON.stringify(list)).then(function () {
        setSaveStatus({ ok: true, msg: "✓ जतन झाले (या फोनवर)" });
      }).catch(function (err) {
        setSaveStatus({ ok: false, msg: "⚠️ जतन करताना अडचण: " + err.message });
        showToast("जतन करताना अडचण आली — खाली 'पुन्हा जतन करा' दाबा");
      });
    }, [showToast]);

    var retrySave = useCallback(function () { return persist(entries); }, [persist, entries]);

    var startReadingNum = parseFloat(form.startReading) || 0;
    var endReadingNum = parseFloat(form.endReading) || 0;
    var rateNum = parseFloat(form.rate) || 0;
    var hoursCalc = Math.max(endReadingNum - startReadingNum, 0);
    var amountCalc = hoursCalc * rateNum;

    function updateOtherRow(idx, field, value) {
      setForm(function (f) {
        var rows = f.otherExpenses.slice();
        var row = Object.assign({}, rows[idx]);
        row[field] = value;
        rows[idx] = row;
        return Object.assign({}, f, { otherExpenses: rows });
      });
    }
    function addOtherRow() {
      setForm(function (f) {
        return Object.assign({}, f, { otherExpenses: f.otherExpenses.concat([{ amount: "", note: "" }]) });
      });
    }
    function removeOtherRow(idx) {
      setForm(function (f) {
        return Object.assign({}, f, { otherExpenses: f.otherExpenses.filter(function (_, i) { return i !== idx; }) });
      });
    }
    function resetForm() { setForm(emptyForm()); setEditingId(null); }

    function handleSubmit() {
      var dateVal = form.date || todayStr();
      var siteVal = form.site.trim() || "नोंद";
      var otherExpenses = form.otherExpenses
        .filter(function (x) { return (parseFloat(x.amount) || 0) > 0 || x.note.trim(); })
        .map(function (x) { return { amount: parseFloat(x.amount) || 0, note: x.note.trim() }; });
      var otherTotal = otherExpenses.reduce(function (s, x) { return s + x.amount; }, 0);

      var fields = {
        date: dateVal, site: siteVal, startReading: startReadingNum, endReading: endReadingNum,
        hours: hoursCalc, rate: rateNum, amount: amountCalc,
        received: parseFloat(form.received) || 0, diesel: parseFloat(form.diesel) || 0,
        otherExpenses: otherExpenses, other: otherTotal
      };

      var next;
      if (editingId) {
        next = entries.map(function (en) { return en.id === editingId ? Object.assign({}, en, fields) : en; });
        showToast("बदल जतन झाले");
      } else {
        var entry = Object.assign({ id: Date.now() + "-" + Math.random().toString(36).slice(2, 7) }, fields);
        next = entries.concat([entry]);
        showToast("नोंद जमा झाली");
      }
      setEntries(next);
      persist(next);
      resetForm();
    }

    function editEntry(id) {
      var en = entries.find(function (x) { return x.id === id; });
      if (!en) return;
      setEditingId(id);
      setForm({
        date: en.date, site: en.site,
        startReading: String(en.startReading || ""), endReading: String(en.endReading || ""),
        rate: String(en.rate || ""), received: String(en.received || ""), diesel: String(en.diesel || ""),
        otherExpenses: (en.otherExpenses && en.otherExpenses.length)
          ? en.otherExpenses.map(function (x) { return { amount: String(x.amount || ""), note: x.note || "" }; })
          : [{ amount: "", note: "" }]
      });
      var el = document.getElementById("entryForm");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function deleteEntry(id) {
      var next = entries.filter(function (en) { return en.id !== id; });
      setEntries(next);
      persist(next);
      if (editingId === id) resetForm();
    }

    function doExport() {
      setBackupText(JSON.stringify(entries));
      showToast("बॅकअप तयार झाला — मजकूर कॉपी करून सुरक्षित ठिकाणी ठेवा");
    }
    function doExportFile() {
      try {
        var json = JSON.stringify(entries, null, 2);
        var blob = new Blob([json], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var nowIso = new Date().toISOString();
        var fileStamp = todayStr();
        var a = document.createElement("a");
        a.href = url;
        a.download = "jcb-hisab-backup-" + fileStamp + ".json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
        try { window.localStorage.setItem("jcb-hisab-last-backup", fileStamp); } catch (err) {}
        var logEntry = { date: nowIso, count: entries.length };
        var newLog = [logEntry].concat(backupLog).slice(0, 10);
        setBackupLog(newLog);
        try { window.localStorage.setItem(BACKUP_LOG_KEY, JSON.stringify(newLog)); } catch (err) {}
        showToast("फाईल डाउनलोड झाली — फोनच्या Downloads फोल्डरमध्ये सेव्ह आहे");
      } catch (err) {
        showToast("फाईल डाउनलोड करता आली नाही: " + err.message);
      }
    }
    function doImport() {
      var txt = backupText.trim();
      if (!txt) { showToast("कृपया आधी बॅकअपचा मजकूर पेस्ट करा"); return; }
      try {
        var restored = JSON.parse(txt);
        if (!Array.isArray(restored)) throw new Error("bad");
        setEntries(restored);
        persist(restored);
        showToast("नोंदी परत आणल्या — " + restored.length + " नोंदी");
      } catch (err) {
        showToast("मजकूर वाचता आला नाही, तपासून पुन्हा पेस्ट करा");
      }
    }
    function doImportFile(ev) {
      var file = ev.target.files && ev.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var restored = JSON.parse(reader.result);
          if (!Array.isArray(restored)) throw new Error("bad");
          setEntries(restored);
          persist(restored);
          showToast("फाईलमधून नोंदी परत आणल्या — " + restored.length + " नोंदी");
        } catch (err) {
          showToast("ही फाईल वाचता आली नाही, योग्य बॅकअप फाईल निवडा");
        }
      };
      reader.readAsText(file);
      ev.target.value = "";
    }

    var totalBilled = entries.reduce(function (s, en) { return s + en.amount; }, 0);
    var totalReceived = entries.reduce(function (s, en) { return s + en.received; }, 0);
    var totalExpense = entries.reduce(function (s, en) { return s + en.diesel + en.other; }, 0);
    var netProfit = totalReceived - totalExpense;
    var pending = Math.max(totalBilled - totalReceived, 0);

    var cm = (function () {
      var d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    })();
    var monthHours = entries.filter(function (en) { return monthKey(en.date) === cm; }).reduce(function (s, en) { return s + en.hours; }, 0);
    var lifetimeHours = entries.reduce(function (s, en) { return s + en.hours; }, 0);

    var sorted = entries.slice().sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
    var groups = {};
    sorted.forEach(function (en) {
      var k = monthKey(en.date);
      if (!groups[k]) groups[k] = [];
      groups[k].push(en);
    });

    var inputStyle = { width: "100%", background: C.surface2, border: "1px solid " + C.line, color: C.paper, borderRadius: 6, padding: "10px 12px", fontSize: 16, outline: "none" };
    var labelStyle = { display: "block", fontSize: 12, marginBottom: 6, letterSpacing: 0.5, textTransform: "uppercase", fontWeight: 600, color: C.steel };

    var summaryCards = [
      { lbl: "एकूण कमाई", val: fmt(totalBilled), color: C.paper },
      { lbl: "एकूण खर्च", val: fmt(totalExpense), color: C.rust },
      { lbl: "निव्वळ नफा", val: fmt(netProfit), color: netProfit >= 0 ? C.green : C.rust },
      { lbl: "थकीत रक्कम", val: fmt(pending), color: C.yellow }
    ];

    var headerEl = e("div", {
      style: { padding: "28px 16px 20px", position: "relative", overflow: "hidden", borderBottom: "3px solid " + C.yellow, background: "linear-gradient(180deg, #1e2320, " + C.bg + ")" }
    },
      e("div", { style: { position: "absolute", right: -40, top: -40, width: 160, height: 160, borderRadius: "50%", border: "22px solid rgba(245,183,0,0.06)" } }),
      e("div", { style: { maxWidth: 576, margin: "0 auto", position: "relative" } },
        e("div", { style: { fontSize: 12, fontWeight: 700, letterSpacing: 2, textTransform: "uppercase", color: C.yellow } }, "दैनिक हिशोब वही"),
        e("h1", { style: { fontSize: 28, fontWeight: 700, marginTop: 4, marginBottom: 4 } }, "जेसीबी हिशोब"),
        e("div", { style: { fontSize: 14, marginBottom: 16, color: C.steel } }, "मशीनचं रोजचं काम आणि पैशाचा हिशोब — एका ठिकाणी"),
        e("div", { style: { display: "flex", alignItems: "center", gap: 12, marginTop: 8 } },
          e("div", { style: { fontSize: 12, textTransform: "uppercase", letterSpacing: 0.5, width: 112, flexShrink: 0, color: C.steel } }, monthLabel(cm) + " — एकूण तास"),
          e(DigitMeter, { value: monthHours, digits: 4 }),
          e("div", { style: { fontSize: 12, alignSelf: "flex-end", color: C.steel } }, "तास")
        ),
        e("div", { style: { display: "flex", alignItems: "center", gap: 12, marginTop: 8 } },
          e("div", { style: { fontSize: 12, textTransform: "uppercase", letterSpacing: 0.5, width: 112, flexShrink: 0, color: C.steel } }, "एकूण सर्विस तास (सर्व काळ)"),
          e(DigitMeter, { value: lifetimeHours, digits: 5 }),
          e("div", { style: { fontSize: 12, alignSelf: "flex-end", color: C.steel } }, "तास")
        ),
        e("div", { style: { marginTop: 12, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" } },
          e("div", {
            style: {
              display: "inline-block", fontSize: 12, fontWeight: 700, padding: "6px 10px", borderRadius: 6,
              background: saveStatus.ok ? "rgba(122,166,99,0.1)" : "rgba(193,68,14,0.15)",
              color: saveStatus.ok ? C.green : C.rust
            }
          }, saveStatus.msg),
          (!saveStatus.ok && entries.length > 0) ? e("button", {
            onClick: retrySave,
            style: { fontSize: 12, fontWeight: 700, padding: "6px 10px", borderRadius: 6, border: "1px solid " + C.yellow, color: C.yellow, background: "transparent" }
          }, "पुन्हा जतन करा") : null
        )
      )
    );

    var summaryEl = e("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 20 } },
      summaryCards.map(function (c, i) {
        return e("div", { key: i, style: { borderRadius: 12, padding: 14, background: C.surface, border: "1px solid " + C.line } },
          e("div", { style: { fontSize: 12, letterSpacing: 0.5, color: C.steel } }, c.lbl),
          e("div", { style: { fontWeight: 700, fontSize: 22, marginTop: 4, color: c.color, fontVariantNumeric: "tabular-nums" } }, c.val)
        );
      })
    );

    var otherExpenseRows = e("div", { style: { display: "flex", flexDirection: "column", gap: 8, marginBottom: 10 } },
      form.otherExpenses.map(function (row, idx) {
        return e("div", { key: idx, style: { display: "flex", gap: 8, alignItems: "center" } },
          e("input", {
            type: "number",
            style: { borderRadius: 6, padding: "10px 12px", fontSize: 16, width: 96, flexShrink: 0, outline: "none", background: C.surface2, border: "1px solid " + C.line, color: C.paper },
            placeholder: "रक्कम", value: row.amount,
            onChange: function (ev) { updateOtherRow(idx, "amount", ev.target.value); }
          }),
          e("input", {
            type: "text",
            style: { borderRadius: 6, padding: "10px 12px", fontSize: 16, flex: 1, outline: "none", background: C.surface2, border: "1px solid " + C.line, color: C.paper },
            placeholder: "कशासाठी? उदा. ऑइल, जेवण", value: row.note,
            onChange: function (ev) { updateOtherRow(idx, "note", ev.target.value); }
          }),
          e("button", {
            type: "button", onClick: function () { removeOtherRow(idx); },
            style: { flexShrink: 0, width: 36, height: 36, display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 6, border: "1px solid " + C.line, color: C.steel, background: "transparent" }
          }, "✕")
        );
      })
    );

    var formEl = e("div", { id: "entryForm", style: { borderRadius: 12, padding: 16, background: C.surface, border: "1px solid " + C.line } },
      e("label", { style: labelStyle }, "तारीख"),
      e("input", { type: "date", style: Object.assign({}, inputStyle, { marginBottom: 12 }), value: form.date, onChange: function (ev) { setForm(function (f) { return Object.assign({}, f, { date: ev.target.value }); }); } }),

      e("label", { style: labelStyle }, "ग्राहक / साईटचे नाव"),
      e("input", { type: "text", style: Object.assign({}, inputStyle, { marginBottom: 12 }), placeholder: "उदा. पाटील साहेब — शेत खोदाई", value: form.site, onChange: function (ev) { setForm(function (f) { return Object.assign({}, f, { site: ev.target.value }); }); } }),

      e("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 } },
        e("div", null,
          e("label", { style: labelStyle }, "मशीन चालू रिडींग"),
          e("input", { type: "number", style: inputStyle, placeholder: "उदा. 1230.5", value: form.startReading, onChange: function (ev) { setForm(function (f) { return Object.assign({}, f, { startReading: ev.target.value }); }); } })
        ),
        e("div", null,
          e("label", { style: labelStyle }, "मशीन बंद रिडींग"),
          e("input", { type: "number", style: inputStyle, placeholder: "उदा. 1236.5", value: form.endReading, onChange: function (ev) { setForm(function (f) { return Object.assign({}, f, { endReading: ev.target.value }); }); } })
        )
      ),

      e("label", { style: labelStyle }, "तासाचा दर (₹)"),
      e("input", { type: "number", style: Object.assign({}, inputStyle, { marginBottom: 12 }), placeholder: "उदा. 800", value: form.rate, onChange: function (ev) { setForm(function (f) { return Object.assign({}, f, { rate: ev.target.value }); }); } }),

      e("div", { style: { borderRadius: 8, padding: "10px 12px", marginBottom: 8, display: "flex", justifyContent: "space-between", fontSize: 14, background: C.surface2, border: "1px dashed " + C.line, color: C.steel } },
        e("span", null, "एकूण तास"),
        e("b", { style: { fontWeight: 700, color: C.yellow } }, hoursCalc.toFixed(1))
      ),
      e("div", { style: { borderRadius: 8, padding: "10px 12px", marginBottom: 14, display: "flex", justifyContent: "space-between", fontSize: 14, background: C.surface2, border: "1px dashed " + C.line, color: C.steel } },
        e("span", null, "एकूण रक्कम"),
        e("b", { style: { fontWeight: 700, fontSize: 18, color: C.yellow } }, fmt(amountCalc))
      ),

      e("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 } },
        e("div", null,
          e("label", { style: labelStyle }, "मिळालेली रक्कम (₹)"),

    } else {

              e("div", { style: { display: "flex", flexWrap: "wrap", gap: "4px 14px", marginTop: 8, fontSize: 14, color: C.steel } },
                e("span", null, en.hours + " तास × " + fmt(en.rate)),
                en.startReading !== undefined ? e("span", null, "रिडींग: ", e("b", { style: { color: C.paper, fontVariantNumeric: "tabular-nums" } }, en.startReading + " → " + en.endReading)) : null,
                en.diesel > 0 ? e("span", null, "डिझेल: ", e("b", { style: { color: C.paper, fontVariantNumeric: "tabular-nums" } }, fmt(en.diesel))) : null
              ),
              otherLines.length > 0 ? e("div", { style: { display: "flex", flexDirection: "column", gap: 4, marginTop: 8 } },
                otherLines.map(function (x, i) {
                  return e("div", { key: i, style: { display: "flex", justifyContent: "space-between", fontSize: 14, borderRadius: 6, padding: "6px 10px", color: C.steel, background: C.surface2 } },
                    e("span", null, x.note || "इतर खर्च"),
                    e("b", { style: { color: C.paper, fontVariantNumeric: "tabular-nums" } }, fmt(x.amount))
                  );
                })
              ) : null,
              e("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 10, paddingTop: 10, borderTop: "1px solid " + C.line } },
                e("div", { style: { display: "flex", alignItems: "center", gap: 8 } },
                  e("span", { style: { fontWeight: 700, fontSize: 18 } }, fmt(en.amount)),
                  due > 0
                    ? e("span", { style: { fontSize: 12, padding: "2px 8px", borderRadius: 999, background: "rgba(245,183,0,0.15)", color: C.yellow } }, "थकीत " + fmt(due))
                    : e("span", { style: { fontSize: 12, padding: "2px 8px", borderRadius: 999, background: "rgba(122,166,99,0.15)", color: C.green } }, "पूर्ण मिळाले")
                ),
                e("div", { style: { display: "flex", gap: 8 } },
                  e("button", { onClick: function () { editEntry(en.id); }, style: { fontSize: 12, padding: "6px 10px", borderRadius: 6, display: "flex", alignItems: "center", gap: 4, border: "1px solid " + C.yellow, color: C.yellow, background: "transparent" } }, "✎ एडिट"),
                  e("button", { onClick: function () { deleteEntry(en.id); }, style: { fontSize: 12, padding: "6px 10px", borderRadius: 6, display: "flex", alignItems: "center", gap: 4, border: "1px solid " + C.line, color: C.steel, background: "transparent" } }, "🗑 काढून टाका")
                )
              ),
              (en.diesel > 0 || en.other > 0) ? e("div", { style: { marginTop: 8, paddingTop: 8, textAlign: "right", fontSize: 14, borderTop: "1px dashed " + C.line, color: C.steel } },
                "खर्च वजा जाता निव्वळ: ",
                e("b", { style: { fontSize: 15, color: netAmt >= 0 ? C.green : C.rust } }, fmt(netAmt))
              ) : null
            );
          })
        );
      });
    }

    var lastBackup = null;
    try { lastBackup = window.localStorage.getItem("jcb-hisab-last-backup"); } catch (err) {}
    var daysSinceBackup = null;
    if (lastBackup) {
      daysSinceBackup = Math.floor((new Date() - new Date(lastBackup)) / (1000 * 60 * 60 * 24));
    }
    var backupReminder = (!lastBackup)
      ? "अजून एकही फाईल बॅकअप घेतलेला नाही — आत्ताच घ्या."
      : (daysSinceBackup >= 7)
        ? "शेवटचा बॅकअप " + daysSinceBackup + " दिवसांपूर्वी घेतला होता — पुन्हा घ्या."
        : "शेवटचा बॅकअप " + daysSinceBackup + " दिवसांपूर्वी घेतला होता.";

    var backupEl = e("div", { style: { borderRadius: 12, padding: 14, marginBottom: 24, background: C.surface, border: "1px solid " + C.line } },
      e("p", { style: { fontSize: 14, lineHeight: 1.6, marginBottom: 6, color: C.steel } }, "हा डेटा फक्त याच फोनवर, याच अ‍ॅपमध्ये साठवला जातो. फोन हरवला, अ‍ॅप डिलीट झाला किंवा डेटा साफ झाला तर तो परत मिळणार नाही — म्हणून अधूनमधून फाईल बॅकअप घेत रहा."),
      e("p", { style: { fontSize: 12, marginBottom: 12, color: (!lastBackup || daysSinceBackup >= 7) ? C.yellow : C.green, fontWeight: 600 } }, backupReminder),

      e("button", {
        onClick: doExportFile,
        style: { width: "100%", borderRadius: 8, padding: "12px 0", fontSize: 15, fontWeight: 700, marginBottom: 8, border: "none", color: C.bg, background: C.yellow }
      }, "⬇ बॅकअप फाईल डाउनलोड करा"),
      e("p", { style: { fontSize: 12, marginBottom: 14, color: C.steel } }, "ही फाईल फोनच्या Downloads फोल्डरमध्ये सेव्ह होईल. ती WhatsApp वर स्वतःला पाठवा किंवा Google Drive वर ठेवा म्हणजे जास्त सुरक्षित राहील."),

      backupLog.length > 0 ? e("div", { style: { marginBottom: 14 } },
        e("div", { style: { fontSize: 12, fontWeight: 700, letterSpacing: 0.5, textTransform: "uppercase", color: C.yellow, marginBottom: 8 } }, "बॅकअप इतिहास"),
        e("div", { style: { display: "flex", flexDirection: "column", gap: 6 } },
          backupLog.map(function (log, i) {
            return e("div", {
              key: i,
              style: { display: "flex", justifyContent: "space-between", fontSize: 13, borderRadius: 6, padding: "8px 10px", background: C.surface2, border: "1px solid " + C.line, color: C.steel }
            },
              e("span", null, formatLogDate(log.date)),
              e("b", { style: { color: C.paper } }, log.count + " नोंदी")
            );
          })
        )
      ) : null,

      e("label", {
        style: { display: "block", width: "100%", textAlign: "center", borderRadius: 8, padding: "10px 0", fontSize: 14, marginBottom: 14, border: "1px solid " + C.yellow, color: C.yellow, cursor: "pointer" }
      },
        "📁 फाईलमधून नोंदी परत आणा",
        e("input", { type: "file", accept: ".json,application/json", onChange: doImportFile, style: { display: "none" } })
      ),

      e("div", { style: { borderTop: "1px dashed " + C.line, paddingTop: 12 } },
        e("p", { style: { fontSize: 12, marginBottom: 10, color: C.steel } }, "किंवा जुन्या पद्धतीने मजकूर कॉपी-पेस्ट करून:"),
        e("button", { onClick: doExport, style: { width: "100%", borderRadius: 8, padding: "10px 0", fontSize: 14, marginBottom: 10, border: "1px solid " + C.line, color: C.steel, background: "transparent" } }, "बॅकअप मजकूर तयार करा"),
        e("textarea", {
          rows: 4,
          style: { width: "100%", borderRadius: 6, padding: "10px 12px", fontSize: 12, fontFamily: "monospace", marginBottom: 10, outline: "none", background: C.surface2, border: "1px solid " + C.line, color: C.paper },
          placeholder: "इथे बॅकअपचा मजकूर दिसेल / परत आणण्यासाठी इथे पेस्ट करा",
          value: backupText,
          onChange: function (ev) { setBackupText(ev.target.value); }
        }),
        e("button", { onClick: doImport, style: { width: "100%", borderRadius: 8, padding: "10px 0", fontSize: 14, border: "1px solid " + C.line, color: C.steel, background: "transparent" } }, "वरील मजकुरातून नोंदी परत आणा")
      )
    );

    return e("div", { style: { minHeight: "100vh", paddingBottom: 64, background: C.bg, color: C.paper, fontFamily: "'Noto Sans Devanagari','Noto Sans',sans-serif" } },

      headerEl,
      e("div", { style: { maxWidth: 576, margin: "0 auto", padding: "0 14px" } },
        summaryEl,
        e("div", { style: { display: "flex", alignItems: "center", gap: 8, marginTop: 24, marginBottom: 10 } },
          e("div", { style: { fontSize: 12, fontWeight: 700, letterSpacing: 0.5, textTransform: "uppercase", color: C.yellow } }, editingId ? "नोंद बदला" : "नवीन नोंद"),
          e("div", { style: { flex: 1, height: 1, background: C.line } })
        ),
        formEl,
        e("div", { style: { display: "flex", alignItems: "center", gap: 8, marginTop: 24, marginBottom: 10 } },
          e("div", { style: { fontSize: 12, fontWeight: 700, letterSpacing: 0.5, textTransform: "uppercase", color: C.yellow } }, "सर्व नोंदी"),
          e("div", { style: { flex: 1, height: 1, background: C.line } })
        ),
        entriesListEl,
        e("div", { style: { display: "flex", alignItems: "center", gap: 8, marginTop: 24, marginBottom: 10 } },
          e("div", { style: { fontSize: 12, fontWeight: 700, letterSpacing: 0.5, textTransform: "uppercase", color: C.yellow } }, "डेटा बॅकअप"),
          e("div", { style: { flex: 1, height: 1, background: C.line } })
        ),
        backupEl
      ),
      toast ? e("div", {
        style: { position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)", fontWeight: 700, padding: "14px 24px", borderRadius: 999, boxShadow: "0 4px 20px rgba(0,0,0,0.4)", fontSize: 16, maxWidth: "90%", textAlign: "center", zIndex: 50, background: C.yellow, border: "2px solid #000", color: C.bg }
      }, toast) : null
    );
  }

  /* ---------- PIN lock gate ---------- */
  var PIN_KEY = "jcb-hisab-pin";
  var PIN_LEN = 4;

  function Dots(props) {
    var filled = props.filled, count = props.count;
    var dots = [];
    for (var i = 0; i < count; i++) {
      dots.push(e("div", {
        key: i,
        style: {
          width: 16, height: 16, borderRadius: "50%",
          border: "2px solid " + C.yellow,
          background: i < filled ? C.yellow : "transparent",
          transition: "background 0.15s"
        }
      }));
    }
    return e("div", { style: { display: "flex", gap: 14, justifyContent: "center", margin: "24px 0" } }, dots);
  }

  function Keypad(props) {
    var onDigit = props.onDigit, onBackspace = props.onBackspace;
    var keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "⌫"];
    return e("div", {
      style: { display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 14, maxWidth: 280, margin: "0 auto" }
    }, keys.map(function (k, i) {
      if (k === "") return e("div", { key: i });
      var isBack = k === "⌫";
      return e("button", {
        key: i,
        type: "button",
        onClick: function () { isBack ? onBackspace() : onDigit(k); },
        style: {
          fontSize: 22, fontWeight: 700, padding: "16px 0", borderRadius: 12,
          background: C.surface, border: "1px solid " + C.line, color: isBack ? C.rust : C.paper,
          cursor: "pointer"
        }
      }, k);
    }));
  }

  function PinGate(props) {
    var storedState = useState(null); var stored = storedState[0]; var setStored = storedState[1];
    var loadedState = useState(false); var loaded = loadedState[0]; var setLoaded = loadedState[1];
    var unlockedState = useState(false); var unlocked = unlockedState[0]; var setUnlocked = unlockedState[1];
    var modeState = useState("enter"); var mode = modeState[0]; var setMode = modeState[1]; // enter | set | confirm
    var inputState = useState(""); var input = inputState[0]; var setInput = inputState[1];
    var firstPinState = useState(""); var firstPin = firstPinState[0]; var setFirstPin = firstPinState[1];
    var errorState = useState(""); var error = errorState[0]; var setError = errorState[1];

    useEffect(function () {
      var p = null;
      try { p = window.localStorage.getItem(PIN_KEY); } catch (err) {}
      setStored(p);
      setMode(p ? "enter" : "set");
      setLoaded(true);
    }, []);

    function onDigit(d) {
      if (input.length >= PIN_LEN) return;
      var next = input + d;
      setError("");
      if (next.length === PIN_LEN) {
        if (mode === "set") {
          setFirstPin(next);
          setInput("");
          setMode("confirm");
        } else if (mode === "confirm") {
          if (next === firstPin) {
            try { window.localStorage.setItem(PIN_KEY, next); } catch (err) {}
            setStored(next);
            setInput("");
            setUnlocked(true);
          } else {
            setError("पिन जुळत नाही, पुन्हा प्रयत्न करा");
            setInput("");
            setFirstPin("");
            setMode("set");
          }
        } else { // enter
          if (next === stored) {
            setInput("");
            setUnlocked(true);
          } else {
            setError("चुकीचा पिन");
            setInput("");
          }
        }
      } else {
        setInput(next);
      }
    }
    function onBackspace() {
      setInput(function (v) { return v.slice(0, -1); });
    }
    function resetPin() {
      if (window.confirm("पिन रीसेट करायचा? (तुमचा जमा-खर्चाचा डेटा तसाच राहील, फक्त नवीन पिन सेट करावा लागेल)")) {
        try { window.localStorage.removeItem(PIN_KEY); } catch (err) {}
        setStored(null);
        setMode("set");
        setInput("");
        setFirstPin("");
        setError("");
      }
    }

    if (!loaded) return null;
    if (unlocked) return props.children;

    var title = mode === "set" ? "नवीन पिन सेट करा" : mode === "confirm" ? "पिन पुन्हा टाका" : "पिन टाका";
    var sub = mode === "set" ? "अ‍ॅप उघडण्यासाठी 4 अंकी पिन तयार करा" : mode === "confirm" ? "खात्री करण्यासाठी तोच पिन पुन्हा टाका" : "अ‍ॅप उघडण्यासाठी तुमचा पिन टाका";

    return e("div", {
      style: { minHeight: "100vh", background: C.bg, color: C.paper, fontFamily: "'Noto Sans Devanagari','Noto Sans',sans-serif", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }
    },
      e("div", { style: { fontSize: 12, fontWeight: 700, letterSpacing: 2, textTransform: "uppercase", color: C.yellow, marginBottom: 8 } }, "जेसीबी हिशोब"),
      e("div", { style: { fontSize: 20, fontWeight: 700, marginBottom: 4 } }, title),
      e("div", { style: { fontSize: 13, color: C.steel, marginBottom: 8, textAlign: "center" } }, sub),
      e(Dots, { filled: input.length, count: PIN_LEN }),
      error ? e("div", { style: { color: C.rust, fontSize: 13, marginBottom: 12, textAlign: "center" } }, error) : null,
      e(Keypad, { onDigit: onDigit, onBackspace: onBackspace }),
      mode === "enter" ? e("button", {
        type: "button", onClick: resetPin,
        style: { marginTop: 28, fontSize: 13, color: C.steel, background: "transparent", border: "none", textDecoration: "underline", cursor: "pointer" }
      }, "पिन विसरलात? रीसेट करा") : null
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(
    e(PinGate, null, e(JcbHisab))
  );
})();
